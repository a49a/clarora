name: CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Typecheck and tests (shared code)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clarora-app/package-lock.json
      - name: Install bsdtar (libarchive-tools) for release package verification
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - run: npm ci
        working-directory: clarora-app
      - run: npm run check:react-renderer
        working-directory: clarora-app
      - run: npm run typecheck
        working-directory: clarora-app
      - run: npm run lint
        working-directory: clarora-app
      - run: npm test
        working-directory: clarora-app
  android:
    name: Android smoke build and emulator
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clarora-app/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
        working-directory: clarora-app
      - run: npm run android:apk
        working-directory: clarora-app
      - name: Build debug-signed release APK for emulator smoke
        working-directory: clarora-app
        run: npm run android:smoke:build
      - name: Run Android emulator smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            cd clarora-app
            CLARORA_ANDROID_SMOKE_OUT="$GITHUB_WORKSPACE/clarora-app/android-smoke" \
              bash scripts/android-smoke.sh android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Clarora-android-smoke
          path: clarora-app/android-smoke/
          if-no-files-found: ignore
  macos:
    name: macOS debug build
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clarora-app/package-lock.json
      - run: brew install mpv whisper-cpp
      - name: Install sherpa-onnx libraries
        run: sh scripts/install-macos-asr-libs.sh
        working-directory: clarora-app
      - run: npm ci
        working-directory: clarora-app
      - name: Check bilibili native process lifecycle
        run: python3 scripts/check-bilibili-native.py bilibili-native-report
        working-directory: clarora-app
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Clarora-bilibili-native-report
          path: clarora-app/bilibili-native-report/*.json
          if-no-files-found: ignore
      - run: node scripts/ensure-macos-pods.cjs
        working-directory: clarora-app
      - run: >-
          xcodebuild -workspace macos/Clarora.xcworkspace
          -scheme Clarora-macOS -configuration Debug
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO build
        working-directory: clarora-app
  ios:
    name: iOS simulator build
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clarora-app/package-lock.json
      - run: npm ci
        working-directory: clarora-app
      - run: npm run ios:pods
        working-directory: clarora-app
      - run: >-
          xcodebuild -workspace ios/Clarora.xcworkspace
          -scheme Clarora-iOS -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
        working-directory: clarora-app
