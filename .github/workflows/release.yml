name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要打包的 tag（如 v0.1.0）；留空使用当前 ref"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  macos:
    name: macOS release build
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clarora-app/package-lock.json
      - run: brew install mpv whisper-cpp
      - name: Install sherpa-onnx libraries
        run: sh clarora-app/scripts/install-macos-asr-libs.sh
      - run: npm ci
        working-directory: clarora-app
      - run: node scripts/ensure-macos-pods.cjs
        working-directory: clarora-app
      - name: Build Release app
        working-directory: clarora-app
        run: |
          xcodebuild -workspace macos/Clarora.xcworkspace \
            -scheme Clarora-macOS -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath macos/build/release CODE_SIGNING_ALLOWED=NO build
      - name: Bundle runtime dylibs
        run: sh scripts/bundle-macos-libs.sh macos/build/release/Build/Products/Release/Clarora.app
        working-directory: clarora-app
      - name: Package dmg
        working-directory: clarora-app
        run: |
          APP="macos/build/release/Build/Products/Release/Clarora.app"
          test -d "$APP"
          rm -rf /tmp/clarora-stage && mkdir -p /tmp/clarora-stage
          cp -R "$APP" /tmp/clarora-stage/
          hdiutil create -volname "Clarora" -srcfolder /tmp/clarora-stage \
            -ov -format UDZO "Clarora-macos-arm64.zip.dmg" >/dev/null
          mv "Clarora-macos-arm64.zip.dmg" "Clarora-macos-arm64.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: Clarora-macos-arm64
          path: clarora-app/Clarora-macos-arm64.dmg
          if-no-files-found: error
  windows:
    name: Windows release build
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clarora-app/package-lock.json
      - run: npm ci
        working-directory: clarora-app
      - name: Build on-device ASR library (clarora_asr.dll)
        continue-on-error: true  # 端侧转写为可选组件;失败时应用降级为无本地转写
        timeout-minutes: 35
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-windows-asr.ps1
        working-directory: clarora-app
      - run: npm run windows:build
        working-directory: clarora-app
      - name: Package zip
        shell: pwsh
        working-directory: clarora-app
        run: |
          Compress-Archive -Path "windows/AppPackages/*" -DestinationPath "Clarora-windows-x64.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Clarora-windows-x64
          path: clarora-app/Clarora-windows-x64.zip
          if-no-files-found: error
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [macos, windows]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Rename artifacts and generate checksums
        run: |
          mkdir -p release
          cp dist/Clarora-macos-arm64/Clarora-macos-arm64.dmg release/
          cp dist/Clarora-windows-x64/Clarora-windows-x64.zip release/
          cd release
          sha256sum * > SHA256SUMS.txt
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/* --verify-tag --generate-notes \
            --title "Clarora $GITHUB_REF_NAME"
        working-directory: .
