name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要打包的 tag（如 v0.1.0）；留空使用当前 ref"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  resolve:
    name: Resolve release tag and source
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release tag and source sha
        id: resolve
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            tag="${{ github.event.inputs.tag }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            echo "::error::手动发布必须提供有效 tag(如 v0.1.0)"; exit 1
          fi
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
          sha="$(git rev-parse "$tag^{commit}")"
          # 应用显示版本必须与 tag 一致,不允许只改 Release 标题。
          pkg_version="$(git show "$tag:clarora-app/package.json" | python3 -c "import json,sys;print(json.load(sys.stdin)['version'])")"
          if [ "${tag#v}" != "$pkg_version" ]; then
            echo "::error::tag($tag) 与 package.json 版本($pkg_version)不一致,请先对齐版本再发布"; exit 1
          fi
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "source_sha=$sha" >> "$GITHUB_OUTPUT"
          echo "resolved: $tag @ $sha"
  macos:
    name: macOS release build
    needs: resolve
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.release_tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clarora-app/package-lock.json
      - run: brew install mpv whisper-cpp
      - name: Install sherpa-onnx libraries
        run: sh clarora-app/scripts/install-macos-asr-libs.sh
      - run: npm ci
        working-directory: clarora-app
      - run: node scripts/ensure-macos-pods.cjs
        working-directory: clarora-app
      - name: Build Release app
        working-directory: clarora-app
        run: |
          xcodebuild -workspace macos/Clarora.xcworkspace \
            -scheme Clarora-macOS -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath macos/build/release CODE_SIGNING_ALLOWED=NO build
      - name: Bundle runtime dylibs
        run: bash scripts/bundle-macos-libs.sh macos/build/release/Build/Products/Release/Clarora.app
        working-directory: clarora-app
      - name: Package dmg
        working-directory: clarora-app
        run: |
          APP="macos/build/release/Build/Products/Release/Clarora.app"
          test -d "$APP"
          rm -rf /tmp/clarora-stage && mkdir -p /tmp/clarora-stage
          cp -R "$APP" /tmp/clarora-stage/
          hdiutil create -volname "Clarora" -srcfolder /tmp/clarora-stage \
            -ov -format UDZO "Clarora-macos-arm64.zip.dmg" >/dev/null
          mv "Clarora-macos-arm64.zip.dmg" "Clarora-macos-arm64.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: Clarora-macos-arm64
          path: clarora-app/Clarora-macos-arm64.dmg
          if-no-files-found: error
  windows:
    name: Windows release build
    needs: resolve
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.release_tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clarora-app/package-lock.json
      - run: npm ci
        working-directory: clarora-app
      - name: Build on-device ASR library (clarora_asr.dll)
        id: asr
        continue-on-error: true  # 端侧转写为可选组件;失败时应用降级为无本地转写
        timeout-minutes: 35
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-windows-asr.ps1
        working-directory: clarora-app
      - run: npm run windows:build
        working-directory: clarora-app
      - name: Capability gate - the standard package must include on-device transcription
        if: steps.asr.outcome == 'failure'
        run: |
          if ([System.IO.File]::Exists('clarora-app/windows/Clarora/clarora_asr.dll')) {
            Write-Host 'clarora_asr.dll present (built before the timeout cut the auxiliary steps).'
          } else {
            throw '标准安装包声明端侧转写能力,但 clarora_asr.dll 缺失(ASR 构建失败且未产出 DLL)。拒绝发布不完整包;如需能力降级包,请使用独立产物名并在 Release 说明中声明。'
          }
        working-directory: .
      - name: Package zip
        shell: pwsh
        working-directory: clarora-app
        run: |
          Compress-Archive -Path "windows/AppPackages/*" -DestinationPath "Clarora-windows-x64.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Clarora-windows-x64
          path: clarora-app/Clarora-windows-x64.zip
          if-no-files-found: error
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [resolve, macos, windows]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.release_tag }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Rename artifacts and generate checksums
        run: |
          mkdir -p release
          cp dist/Clarora-macos-arm64/Clarora-macos-arm64.dmg release/
          cp dist/Clarora-windows-x64/Clarora-windows-x64.zip release/
          cd release
          sha256sum * > SHA256SUMS.txt
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
        run: |
          printf '{\n  "version": "%s",\n  "tag": "%s",\n  "source_sha": "%s",\n  "platforms": [\n    { "platform": "macos", "arch": "arm64", "asset_name": "Clarora-macos-arm64.dmg", "url": "https://github.com/a49a/clarora/releases/download/%s/Clarora-macos-arm64.dmg" },\n    { "platform": "windows", "arch": "x64", "asset_name": "Clarora-windows-x64.zip", "url": "https://github.com/a49a/clarora/releases/download/%s/Clarora-windows-x64.zip" }\n  ]\n}\n' "$RELEASE_TAG" "$RELEASE_TAG" "$SOURCE_SHA" "$RELEASE_TAG" "$RELEASE_TAG" > release/release-metadata.json
          gh release create "$RELEASE_TAG" \
            release/* --verify-tag --generate-notes \
            --title "Clarora $RELEASE_TAG"
        working-directory: .
