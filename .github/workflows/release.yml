name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要打包的 tag（如 v0.2.0）；留空使用当前 ref"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  resolve:
    name: Resolve release tag and source
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      android_build_number: ${{ steps.resolve.outputs.android_build_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release tag and source sha
        id: resolve
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED_TAG" ]; then
            tag="$REQUESTED_TAG"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            echo "::error::手动发布必须提供有效 tag(如 v0.2.0)"; exit 1
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
          sha="$(git rev-parse "$tag^{commit}")"
          # 应用显示版本必须与 tag 一致,不允许只改 Release 标题。
          pkg_version="$(git show "$tag:clarora-app/package.json" | python3 -c "import json,sys;print(json.load(sys.stdin)['version'])")"
          if [ "${tag#v}" != "$pkg_version" ]; then
            echo "::error::tag($tag) 与 package.json 版本($pkg_version)不一致,请先对齐版本再发布"; exit 1
          fi
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "source_sha=$sha" >> "$GITHUB_OUTPUT"
          # Stable monotonic code for semantic versions; rebuilding a tag preserves it.
          code="$(python3 -c 'import sys; a,b,c=map(int,sys.argv[1].split(".")); assert 0<=a<999 and 0<=b<1000 and 0<=c<1000; print(a*1000000+b*1000+c+1)' "$pkg_version")"
          echo "android_build_number=$code" >> "$GITHUB_OUTPUT"
          echo "resolved: $tag @ $sha"
  macos:
    name: macOS release build
    needs: resolve
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # 按 resolve 出的提交 SHA 固定检出,而非 tag 名:tag 在流水线中途被
          # 移动也不会造成"构建的代码与校验的来源不一致"。
          ref: ${{ needs.resolve.outputs.source_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clarora-app/package-lock.json
      - run: brew install mpv whisper-cpp
      - name: Install sherpa-onnx libraries
        run: sh clarora-app/scripts/install-macos-asr-libs.sh
      - run: npm ci
        working-directory: clarora-app
      - run: node scripts/ensure-macos-pods.cjs
        working-directory: clarora-app
      - name: Build Release app
        working-directory: clarora-app
        run: |
          xcodebuild -workspace macos/Clarora.xcworkspace \
            -scheme Clarora-macOS -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath macos/build/release CODE_SIGNING_ALLOWED=NO build
      - name: Bundle runtime dylibs
        run: bash scripts/bundle-macos-libs.sh macos/build/release/Build/Products/Release/Clarora.app
        working-directory: clarora-app
      - name: Verify release capabilities
        run: bash scripts/verify-release.sh macos/build/release/Build/Products/Release/Clarora.app
        working-directory: clarora-app
      - name: Package dmg
        working-directory: clarora-app
        run: |
          APP="macos/build/release/Build/Products/Release/Clarora.app"
          test -d "$APP"
          rm -rf /tmp/clarora-stage && mkdir -p /tmp/clarora-stage
          cp -R "$APP" /tmp/clarora-stage/
          hdiutil create -volname "Clarora" -srcfolder /tmp/clarora-stage \
            -ov -format UDZO "Clarora-macos-arm64.zip.dmg" >/dev/null
          mv "Clarora-macos-arm64.zip.dmg" "Clarora-macos-arm64.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: Clarora-macos-arm64
          path: clarora-app/Clarora-macos-arm64.dmg
          if-no-files-found: error
  windows:
    name: Windows release build
    needs: resolve
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clarora-app/package-lock.json
      - run: npm ci
        working-directory: clarora-app
      - name: Build on-device ASR library (clarora_asr.dll)
        continue-on-error: true  # 端侧转写为可选组件;失败时由最终包验证拦截
        timeout-minutes: 35
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-windows-asr.ps1
        working-directory: clarora-app
      - run: npm run windows:build
        working-directory: clarora-app
      - name: Package zip
        shell: pwsh
        working-directory: clarora-app
        run: |
          Compress-Archive -Path "windows/AppPackages/*" -DestinationPath "Clarora-windows-x64.zip" -Force
      # 能力门槛作用在最终安装包上:不再检查工作目录,而是验证 zip 内确实
      # 包含声明的主程序、端侧转写与 PDF 运行时,缺失即拒绝发布。
      - name: Verify final package capabilities
        working-directory: clarora-app
        run: bash scripts/verify-release.sh Clarora-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Clarora-windows-x64
          path: clarora-app/Clarora-windows-x64.zip
          if-no-files-found: error
  android:
    name: Android release build
    if: vars.CLARORA_ANDROID_RELEASE_ENABLED == 'true'
    needs: resolve
    uses: ./.github/workflows/android-release.yml
    with:
      source_sha: ${{ needs.resolve.outputs.source_sha }}
      build_number: ${{ needs.resolve.outputs.android_build_number }}
    secrets: inherit
  ios:
    name: iOS unsigned device IPA
    needs: resolve
    uses: ./.github/workflows/ios-unsigned.yml
    with:
      source_sha: ${{ needs.resolve.outputs.source_sha }}
      build_number: ${{ needs.resolve.outputs.android_build_number }}
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [resolve, macos, windows, android, ios]
    if: >-
      always() &&
      needs.resolve.result == 'success' &&
      needs.macos.result == 'success' &&
      needs.windows.result == 'success' &&
      needs.ios.result == 'success' &&
      (needs.android.result == 'success' || needs.android.result == 'skipped')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Rename artifacts, generate checksums and metadata
        run: |
          mkdir -p release
          cp dist/Clarora-macos-arm64/Clarora-macos-arm64.dmg release/
          cp dist/Clarora-windows-x64/Clarora-windows-x64.zip release/
          if [ -f dist/Clarora-android/Clarora-android.apk ]; then
            cp dist/Clarora-android/Clarora-android.apk release/
            cp dist/Clarora-android/android-build.json release/
          fi
          cp dist/Clarora-ios-unsigned/Clarora-ios-unsigned.ipa release/
          cp dist/Clarora-ios-unsigned/ios-unsigned-build.json release/
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          IOS_DISTRIBUTION_URL: ${{ vars.IOS_DISTRIBUTION_URL }}
          IOS_DISTRIBUTION_VERSION: ${{ vars.IOS_DISTRIBUTION_VERSION }}
        run: |
          # 与官网 clarora-web/release-metadata.json 完全同一 schema:官网构建
          # 可通过 CLARORA_RELEASE_METADATA 直接消费本文件。
          if [ -f release/Clarora-android.apk ]; then
            android_metadata='{ "status": "released", "arch": "universal", "asset_name": "Clarora-android.apk", "url": "https://github.com/a49a/clarora/releases/download/'"$RELEASE_TAG"'/Clarora-android.apk" }'
          else
            android_metadata='{ "status": "planned" }'
          fi
          cat > release/release-metadata.json <<METADATA
          {
            "version": "${RELEASE_TAG#v}",
            "tag": "$RELEASE_TAG",
            "source_sha": "$SOURCE_SHA",
            "repository": "https://github.com/a49a/clarora",
            "assets_base": "https://github.com/a49a/clarora/releases/download/$RELEASE_TAG",
            "latest_url": "https://github.com/a49a/clarora/releases/tag/$RELEASE_TAG",
            "platforms": {
              "macos": { "status": "released", "arch": "arm64", "asset_name": "Clarora-macos-arm64.dmg", "url": "https://github.com/a49a/clarora/releases/download/$RELEASE_TAG/Clarora-macos-arm64.dmg" },
              "windows": { "status": "released", "arch": "x64", "asset_name": "Clarora-windows-x64.zip", "url": "https://github.com/a49a/clarora/releases/download/$RELEASE_TAG/Clarora-windows-x64.zip" },
              "android": $android_metadata,
              "ios": { "status": "planned" }
            }
          }
          METADATA
          python3 - <<'PYMETA'
          import json, os, re
          from urllib.parse import urlparse
          path = 'release/release-metadata.json'
          metadata = json.load(open(path))
          url = os.environ.get('IOS_DISTRIBUTION_URL', '')
          if url:
              assert os.environ.get('IOS_DISTRIBUTION_VERSION') == metadata['version'], 'iOS channel version must match this release'
              u = urlparse(url)
              assert u.scheme == 'https' and not u.username and not u.password and not u.port
              if u.hostname == 'testflight.apple.com' and re.fullmatch(r'/join/[A-Za-z0-9]+', u.path):
                  channel = 'testflight'
              elif u.hostname == 'apps.apple.com' and re.search(r'/id[0-9]+$', u.path):
                  channel = 'app-store'
              else:
                  raise ValueError('Invalid iOS distribution URL')
              metadata['platforms']['ios'] = dict(status='released', channel=channel, url=url)
              with open(path, 'w') as f: json.dump(metadata, f, indent=2)
          PYMETA
          (cd release && shopt -s nullglob && sha256sum *.dmg *.zip *.apk *.ipa *.json > SHA256SUMS.txt)
          cat > release-notes.md <<'NOTES'
          ### iOS IPA（未签名 / unsigned）
          `Clarora-ios-unsigned.ipa` 是供自行签名使用的 iOS 真机 Release 包。
          下载后不能直接安装；需要用户自行使用有效的证书和描述文件重新签名。
          This IPA requires user signing before installation. It is not a TestFlight or App Store distribution.
          NOTES
          if [ ! -f release/Clarora-android.apk ]; then
            printf '\n### Android\n本次未发布 Android APK；签名发布尚未启用。\n' >> release-notes.md
          fi
          printf '\n[Mobile build and distribution instructions](https://github.com/a49a/clarora/blob/%s/docs/mobile-releases.md)\n' "$RELEASE_TAG" >> release-notes.md
          gh release create "$RELEASE_TAG" \
            release/* --verify-tag --generate-notes \
            --notes-file release-notes.md \
            --title "Clarora $RELEASE_TAG"
        working-directory: .
