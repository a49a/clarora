name: Upload GPUI Windows release assets
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.3.0"
        required: true
      run_id:
        description: "GPUI desktop workflow run that produced the Windows artifact"
        required: true
      source_sha:
        description: "Source commit used for the macOS and Windows builds"
        required: true
permissions:
  contents: write
  actions: read
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: Clarora-GPUI-Windows-x64-unsigned
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifact
      - name: Verify source commit and package version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          head_sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .head_sha)"
          test "$head_sha" = "$SOURCE_SHA"
          # This workflow publishes the Windows artifact only. The macOS job has
          # its own local package verification and its native UI E2E is timing
          # sensitive on hosted runners, so require the Windows job specifically.
          windows_conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" --jq '.jobs[] | select(.name == "windows") | .conclusion')"
          test "$windows_conclusion" = "success"
          package_manifest="$(find artifact -name release-manifest.json -print -quit)"
          test -n "$package_manifest"
          python3 - "$package_manifest" "$TAG" <<'PY'
          import json
          import sys
          manifest = json.load(open(sys.argv[1], encoding="utf-8"))
          version = sys.argv[2].removeprefix("v")
          if manifest.get("version") != version or manifest.get("platform") != "windows":
              raise SystemExit(f"Windows package version/platform mismatch: {manifest}")
          PY
      - name: Rename and upload Windows assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          WINDOWS_RUN_ID: ${{ inputs.run_id }}
          BUILD_NUMBER: ${{ inputs.run_id }}
          SOURCE_VERIFIED: 'true'
        run: |
          set -euo pipefail
          version="${TAG#v}"
          find artifact -maxdepth 4 -type f -print
          zip="$(find artifact -name "Clarora-${version}-windows-x64-unsigned.zip" -print -quit)"
          setup="$(find artifact -name "Clarora-${version}-windows-x64-setup-unsigned.exe" -print -quit)"
          test -n "$zip"
          test -n "$setup"
          cp "$zip" Clarora-windows-x64.zip
          cp "$setup" Clarora-windows-x64-setup-unsigned.exe
          sha256sum Clarora-windows-x64.zip Clarora-windows-x64-setup-unsigned.exe > windows-SHA256SUMS.txt
          cat windows-SHA256SUMS.txt
          gh release download "$TAG" -R a49a/clarora -p macos-assets.json -O macos-assets.json --clobber
          python3 .github/scripts/generate_release_metadata.py
          gh release upload "$TAG" \
            Clarora-windows-x64.zip \
            Clarora-windows-x64-setup-unsigned.exe \
            windows-SHA256SUMS.txt \
            SHA256SUMS.txt \
            source-provenance.json \
            release-metadata.json \
            -R a49a/clarora \
            --clobber
