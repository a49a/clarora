[package]
name = "clarora-gpui"
version = "0.2.1"
edition = "2024"
publish = false
default-run = "clarora-gpui"
license = "BSD-3-Clause"
description = "Clarora native GPUI desktop client for macOS and Windows"

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["rt", "time", "net", "macros"] }
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit", "windows-manifest"] }
gpui-component = "=0.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
uuid = { version = "1", features = ["v4"] }
dirs = "6"
url = "2"
regex = "1"
libloading = "0.8"
image = "0.25"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls", "stream"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
quick-xml = { version = "0.38", features = ["serialize"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
zstd = "0.13"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
pdfium-render = "0.8"
cpal = "0.16"
hound = "3.5"
tar = "0.4"
bzip2 = "0.6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[profile.dev]
debug = 0
incremental = false

[profile.release]
lto = "thin"
strip = true
